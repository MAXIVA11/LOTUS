name: build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Build, test and pack
        shell: pwsh
        run: ./build.ps1

      - uses: actions/upload-artifact@v4
        with:
          name: LOTUS-Setup
          path: dist/LOTUS-Setup.exe
          if-no-files-found: error

  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Build, test and pack
        run: ./build-linux.sh

      - uses: actions/upload-artifact@v4
        with:
          name: LOTUS-linux-x64
          path: dist/lotus-*-linux-x64.tar.gz
          if-no-files-found: error

      # The second half runs LOTUS on a real kernel: an Ubuntu machine under
      # QEMU, with USB devices that QEMU emulates plugged in and pulled out.
      - name: Let the runner use KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install QEMU
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends qemu-system-x86 qemu-utils cloud-image-utils

      - name: Test on a real kernel with emulated USB devices
        run: tests/linux/vm-test.sh dist/linux/lotus-*-linux-x64 "$RUNNER_TEMP/lotus-vm"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: linux-vm-console
          path: ${{ runner.temp }}/lotus-vm/console.log
          if-no-files-found: ignore
