name: build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    permissions:
      contents: read
      # For the attestation: a signed statement that this file was built here, from this commit.
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Build, test and pack
        shell: pwsh
        run: ./build.ps1

      - uses: actions/upload-artifact@v4
        with:
          name: LOTUS-Setup
          path: dist/LOTUS-Setup.exe
          if-no-files-found: error

      - name: Attest the installer
        if: github.event_name == 'push'
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/LOTUS-Setup.exe

  linux:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Build, test and pack
        run: ./build-linux.sh

      - uses: actions/upload-artifact@v4
        with:
          name: LOTUS-linux-x64
          path: dist/lotus-*-linux-x64.tar.gz
          if-no-files-found: error

      - name: Attest the archive
        if: github.event_name == 'push'
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/lotus-*-linux-x64.tar.gz

      # Broken input for the parsers: what a device says about itself, the
      # files of the policy store, the requests on the control channel.
      - name: Fuzz the parsers
        run: dotnet run -c Release --project tests/Lotus.Fuzz -- --seconds 120

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: fuzz-findings
          path: fuzz-findings
          if-no-files-found: ignore

      # The second half runs LOTUS on a real kernel: an Ubuntu machine under
      # QEMU, with USB devices that QEMU emulates plugged in and pulled out.
      - name: Let the runner use KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install QEMU
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends qemu-system-x86 qemu-utils cloud-image-utils

      - name: Test on a real kernel with emulated USB devices
        run: tests/linux/vm-test.sh dist/linux/lotus-*-linux-x64 "$RUNNER_TEMP/lotus-vm"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: linux-vm-console
          path: ${{ runner.temp }}/lotus-vm/console.log
          if-no-files-found: ignore
