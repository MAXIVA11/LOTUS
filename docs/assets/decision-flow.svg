<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 410" width="1000" height="410" role="img" aria-labelledby="t d"><title id="t">The order in which LOTUS decides</title><desc id="d">A device on a USB port passes five checks from left to right. If LOTUS is disarmed, if Windows boots from the device, or if the device is on the trusted list, it is allowed. If it has storage and storage is set to block, or if it does anything else and USB devices are set to trusted only, it is blocked. A device that no check stops is allowed.</desc><defs><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#2B2B3A" stroke-width="1" opacity=".45"/></pattern><pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse"><rect width="4" height="1" fill="#000" opacity=".16"/></pattern><clipPath id="frame"><polygon points="0,0 974,0 1000,26 1000,410 26,410 0,384"/></clipPath></defs><style>.mono{font-family:Consolas,'Cascadia Mono','SF Mono',Menlo,'DejaVu Sans Mono','Liberation Mono',monospace}.cond{font-family:Bahnschrift,'DIN Alternate','DIN Condensed','Roboto Condensed','Arial Narrow','Helvetica Neue',Arial,sans-serif;font-weight:700;font-stretch:condensed}</style><g clip-path="url(#frame)"><rect width="1000" height="410" fill="#08080C"/><rect width="1000" height="410" fill="url(#grid)"/><text x="28" y="34" class="mono" font-size="13" fill="#8D8DA3" text-anchor="start" textLength="202.8" lengthAdjust="spacing" xml:space="preserve">//  THE DECISION, IN ORDER</text><path d="M112 208 H927 V90" fill="none" stroke="#00F0FF" stroke-width="2"/><path d="M200 208 V64 H870" fill="none" stroke="#3DFF8B" stroke-width="2" stroke-dasharray="4 8"/><path d="M350 208 V64 H870" fill="none" stroke="#3DFF8B" stroke-width="2" stroke-dasharray="4 8"/><path d="M500 208 V64 H870" fill="none" stroke="#3DFF8B" stroke-width="2" stroke-dasharray="4 8"/><path d="M650 208 V342 H870" fill="none" stroke="#FF2D95" stroke-width="2" stroke-dasharray="4 8"/><path d="M800 208 V342 H870" fill="none" stroke="#FF2D95" stroke-width="2" stroke-dasharray="4 8"/><polygon points="22,182 112,182 112,234 34,234 22,222" fill="#191923" stroke="#00F0FF" stroke-width="2"/><text x="67" y="205" class="mono" font-size="12" fill="#F4F4F6" text-anchor="middle" textLength="64.8" lengthAdjust="spacing" xml:space="preserve">DEVICE ON</text><text x="67" y="222" class="mono" font-size="12" fill="#F4F4F6" text-anchor="middle" textLength="72" lengthAdjust="spacing" xml:space="preserve">A USB PORT</text><polygon points="139,170 261,170 261,246 151,246 139,234" fill="#111118" stroke="#2B2B3A" stroke-width="2"/><rect x="139" y="170" width="122" height="4" fill="#3DFF8B"/><text x="149" y="192" class="mono" font-size="11" fill="#8D8DA3" text-anchor="start" textLength="13.2" lengthAdjust="spacing" xml:space="preserve">01</text><text x="200" y="212" class="mono" font-size="13" fill="#F4F4F6" text-anchor="middle" textLength="62.4" lengthAdjust="spacing" xml:space="preserve">LOTUS IS</text><text x="200" y="230" class="mono" font-size="13" fill="#F4F4F6" text-anchor="middle" textLength="70.2" lengthAdjust="spacing" xml:space="preserve">DISARMED?</text><text x="209" y="146" class="mono" font-size="12" fill="#3DFF8B" text-anchor="start" textLength="21.6" lengthAdjust="spacing" xml:space="preserve">YES</text><polygon points="289,170 411,170 411,246 301,246 289,234" fill="#111118" stroke="#2B2B3A" stroke-width="2"/><rect x="289" y="170" width="122" height="4" fill="#3DFF8B"/><text x="299" y="192" class="mono" font-size="11" fill="#8D8DA3" text-anchor="start" textLength="13.2" lengthAdjust="spacing" xml:space="preserve">02</text><text x="350" y="212" class="mono" font-size="13" fill="#F4F4F6" text-anchor="middle" textLength="54.6" lengthAdjust="spacing" xml:space="preserve">WINDOWS</text><text x="350" y="230" class="mono" font-size="13" fill="#F4F4F6" text-anchor="middle" textLength="78" lengthAdjust="spacing" xml:space="preserve">BOOT DISK?</text><text x="359" y="146" class="mono" font-size="12" fill="#3DFF8B" text-anchor="start" textLength="21.6" lengthAdjust="spacing" xml:space="preserve">YES</text><polygon points="439,170 561,170 561,246 451,246 439,234" fill="#111118" stroke="#2B2B3A" stroke-width="2"/><rect x="439" y="170" width="122" height="4" fill="#3DFF8B"/><text x="449" y="192" class="mono" font-size="11" fill="#8D8DA3" text-anchor="start" textLength="13.2" lengthAdjust="spacing" xml:space="preserve">03</text><text x="500" y="212" class="mono" font-size="13" fill="#F4F4F6" text-anchor="middle" textLength="46.8" lengthAdjust="spacing" xml:space="preserve">ON THE</text><text x="500" y="230" class="mono" font-size="13" fill="#F4F4F6" text-anchor="middle" textLength="101.4" lengthAdjust="spacing" xml:space="preserve">TRUSTED LIST?</text><text x="509" y="146" class="mono" font-size="12" fill="#3DFF8B" text-anchor="start" textLength="21.6" lengthAdjust="spacing" xml:space="preserve">YES</text><polygon points="589,170 711,170 711,246 601,246 589,234" fill="#111118" stroke="#2B2B3A" stroke-width="2"/><rect x="589" y="170" width="122" height="4" fill="#FF2D95"/><text x="599" y="192" class="mono" font-size="11" fill="#8D8DA3" text-anchor="start" textLength="13.2" lengthAdjust="spacing" xml:space="preserve">04</text><text x="650" y="212" class="mono" font-size="13" fill="#F4F4F6" text-anchor="middle" textLength="93.6" lengthAdjust="spacing" xml:space="preserve">HAS STORAGE,</text><text x="650" y="230" class="mono" font-size="13" fill="#F4F4F6" text-anchor="middle" textLength="101.4" lengthAdjust="spacing" xml:space="preserve">SET TO BLOCK?</text><text x="659" y="280" class="mono" font-size="12" fill="#FF2D95" text-anchor="start" textLength="21.6" lengthAdjust="spacing" xml:space="preserve">YES</text><polygon points="739,170 861,170 861,246 751,246 739,234" fill="#111118" stroke="#2B2B3A" stroke-width="2"/><rect x="739" y="170" width="122" height="4" fill="#FF2D95"/><text x="749" y="192" class="mono" font-size="11" fill="#8D8DA3" text-anchor="start" textLength="13.2" lengthAdjust="spacing" xml:space="preserve">05</text><text x="800" y="212" class="mono" font-size="13" fill="#F4F4F6" text-anchor="middle" textLength="109.2" lengthAdjust="spacing" xml:space="preserve">ANYTHING ELSE,</text><text x="800" y="230" class="mono" font-size="13" fill="#F4F4F6" text-anchor="middle" textLength="101.4" lengthAdjust="spacing" xml:space="preserve">TRUSTED ONLY?</text><text x="809" y="280" class="mono" font-size="12" fill="#FF2D95" text-anchor="start" textLength="21.6" lengthAdjust="spacing" xml:space="preserve">YES</text><text x="275" y="200" class="mono" font-size="12" fill="#8D8DA3" text-anchor="middle" textLength="14.4" lengthAdjust="spacing" xml:space="preserve">NO</text><text x="425" y="200" class="mono" font-size="12" fill="#8D8DA3" text-anchor="middle" textLength="14.4" lengthAdjust="spacing" xml:space="preserve">NO</text><text x="575" y="200" class="mono" font-size="12" fill="#8D8DA3" text-anchor="middle" textLength="14.4" lengthAdjust="spacing" xml:space="preserve">NO</text><text x="725" y="200" class="mono" font-size="12" fill="#8D8DA3" text-anchor="middle" textLength="14.4" lengthAdjust="spacing" xml:space="preserve">NO</text><text x="895" y="200" class="mono" font-size="12" fill="#8D8DA3" text-anchor="middle" textLength="14.4" lengthAdjust="spacing" xml:space="preserve">NO</text><polygon points="870,38 985,38 985,90 882,90 870,78" fill="#3DFF8B"/><text x="927" y="65" class="cond" font-size="22" fill="#08080C" text-anchor="middle" textLength="76" lengthAdjust="spacingAndGlyphs">ALLOWED</text><text x="927" y="82" class="mono" font-size="11" fill="#08080C" text-anchor="middle" textLength="52.8" lengthAdjust="spacing" xml:space="preserve">IT WORKS</text><polygon points="870,316 985,316 985,368 882,368 870,356" fill="#FF2D95"/><text x="927" y="343" class="cond" font-size="22" fill="#08080C" text-anchor="middle" textLength="76" lengthAdjust="spacingAndGlyphs">BLOCKED</text><text x="927" y="360" class="mono" font-size="11" fill="#08080C" text-anchor="middle" textLength="79.2" lengthAdjust="spacing" xml:space="preserve">SWITCHED OFF</text><rect width="1000" height="410" fill="url(#scan)"/><polygon points="0,0 974,0 1000,26 1000,410 26,410 0,384" fill="none" stroke="#2B2B3A" stroke-width="2"/></g></svg>
