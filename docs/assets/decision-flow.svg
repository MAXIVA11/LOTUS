<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 440" width="1000" height="440" role="img" aria-labelledby="t d"><title id="t">The order in which LOTUS decides</title><desc id="d">A device on a USB port passes five checks from left to right. If LOTUS is disarmed, if Windows boots from the device, or if the device is on the trusted list, it is allowed. If it has storage and storage is set to block, or if it does anything else and USB devices are set to trusted only, it is blocked. A device that no check stops is allowed.</desc><defs><pattern id="hz" width="32" height="32" patternUnits="userSpaceOnUse" patternTransform="skewX(-45)"><rect width="32" height="32" fill="#FCEE0A"/><rect width="16" height="32" fill="#08080C"/></pattern><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#2B2B3A" stroke-width="1" opacity=".45"/></pattern><pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse"><rect width="4" height="1" fill="#000" opacity=".16"/></pattern><linearGradient id="sweepfill" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".05"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient><clipPath id="frame"><polygon points="0,0 974,0 1000,26 1000,440 26,440 0,414"/></clipPath><filter id="glow" x="-200%" y="-200%" width="500%" height="500%"><feGaussianBlur stdDeviation="4"/></filter></defs><style>.mono{font-family:Consolas,'Cascadia Mono','SF Mono',Menlo,'DejaVu Sans Mono','Liberation Mono',monospace}.cond{font-family:Bahnschrift,'DIN Alternate','DIN Condensed','Roboto Condensed','Arial Narrow','Helvetica Neue',Arial,sans-serif;font-weight:700;font-stretch:condensed}@keyframes slide{to{transform:translateX(32px)}}@keyframes slideback{to{transform:translateX(-32px)}}@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}@keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}.slide{animation:slide 1.4s linear infinite}.slideback{animation:slideback 1.4s linear infinite}.blink{animation:blink 1s steps(1) infinite}.pulse{animation:pulse 1.6s ease-in-out infinite}@keyframes dash{to{stroke-dashoffset:-24}}.flowline{stroke-dasharray:4 8;animation:dash 1.2s linear infinite}@keyframes lamp{0%,100%{opacity:.35}50%{opacity:1}}.lamp{animation:lamp 2s ease-in-out infinite}@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style><g clip-path="url(#frame)"><rect width="1000" height="440" fill="#08080C"/><rect width="1000" height="440" fill="url(#grid)"/><text x="28" y="34" class="mono" font-size="13" fill="#8D8DA3" text-anchor="start" textLength="202.8" lengthAdjust="spacing" xml:space="preserve">//  THE DECISION, IN ORDER</text><path d="M112 222 H927 V104" fill="none" stroke="#2B2B3A" stroke-width="2"/><path class="flowline" d="M200 222 V78 H870" fill="none" stroke="#3DFF8B" stroke-width="2"/><path class="flowline" d="M350 222 V78 H870" fill="none" stroke="#3DFF8B" stroke-width="2"/><path class="flowline" d="M500 222 V78 H870" fill="none" stroke="#3DFF8B" stroke-width="2"/><path class="flowline" d="M650 222 V356 H870" fill="none" stroke="#FF2D95" stroke-width="2"/><path class="flowline" d="M800 222 V356 H870" fill="none" stroke="#FF2D95" stroke-width="2"/><path class="flowline" d="M112 222 H927 V104" fill="none" stroke="#00F0FF" stroke-width="2" opacity=".55"/><circle r="9" fill="#3DFF8B" filter="url(#glow)" opacity=".9"><animateMotion dur="7.2s" begin="0s" repeatCount="indefinite" path="M112 222 H500 V78 H870" calcMode="linear"/></circle><circle r="5" fill="#3DFF8B"><animateMotion dur="7.2s" begin="0s" repeatCount="indefinite" path="M112 222 H500 V78 H870" calcMode="linear"/></circle><circle r="9" fill="#FF2D95" filter="url(#glow)" opacity=".9"><animateMotion dur="7.2s" begin="-4.8s" repeatCount="indefinite" path="M112 222 H650 V356 H870" calcMode="linear"/></circle><circle r="5" fill="#FF2D95"><animateMotion dur="7.2s" begin="-4.8s" repeatCount="indefinite" path="M112 222 H650 V356 H870" calcMode="linear"/></circle><circle r="9" fill="#00F0FF" filter="url(#glow)" opacity=".9"><animateMotion dur="7.2s" begin="-2.4s" repeatCount="indefinite" path="M112 222 H927 V104" calcMode="linear"/></circle><circle r="5" fill="#00F0FF"><animateMotion dur="7.2s" begin="-2.4s" repeatCount="indefinite" path="M112 222 H927 V104" calcMode="linear"/></circle><polygon points="22,196 112,196 112,248 34,248 22,236" fill="#191923" stroke="#00F0FF" stroke-width="2"/><text x="67" y="219" class="mono" font-size="12" fill="#F4F4F6" text-anchor="middle" textLength="64.8" lengthAdjust="spacing" xml:space="preserve">DEVICE ON</text><text x="67" y="236" class="mono" font-size="12" fill="#F4F4F6" text-anchor="middle" textLength="72" lengthAdjust="spacing" xml:space="preserve">A USB PORT</text><polygon points="139,184 261,184 261,260 151,260 139,248" fill="#111118" stroke="#2B2B3A" stroke-width="2"/><rect x="139" y="184" width="122" height="4" fill="#3DFF8B"/><text x="149" y="206" class="mono" font-size="11" fill="#8D8DA3" text-anchor="start" textLength="13.2" lengthAdjust="spacing" xml:space="preserve">01</text><text x="200" y="226" class="mono" font-size="13" fill="#F4F4F6" text-anchor="middle" textLength="62.4" lengthAdjust="spacing" xml:space="preserve">LOTUS IS</text><text x="200" y="244" class="mono" font-size="13" fill="#F4F4F6" text-anchor="middle" textLength="70.2" lengthAdjust="spacing" xml:space="preserve">DISARMED?</text><text x="209" y="160" class="mono" font-size="12" fill="#3DFF8B" text-anchor="start" textLength="21.6" lengthAdjust="spacing" xml:space="preserve">YES</text><polygon points="289,184 411,184 411,260 301,260 289,248" fill="#111118" stroke="#2B2B3A" stroke-width="2"/><rect x="289" y="184" width="122" height="4" fill="#3DFF8B"/><text x="299" y="206" class="mono" font-size="11" fill="#8D8DA3" text-anchor="start" textLength="13.2" lengthAdjust="spacing" xml:space="preserve">02</text><text x="350" y="226" class="mono" font-size="13" fill="#F4F4F6" text-anchor="middle" textLength="54.6" lengthAdjust="spacing" xml:space="preserve">WINDOWS</text><text x="350" y="244" class="mono" font-size="13" fill="#F4F4F6" text-anchor="middle" textLength="78" lengthAdjust="spacing" xml:space="preserve">BOOT DISK?</text><text x="359" y="160" class="mono" font-size="12" fill="#3DFF8B" text-anchor="start" textLength="21.6" lengthAdjust="spacing" xml:space="preserve">YES</text><polygon points="439,184 561,184 561,260 451,260 439,248" fill="#111118" stroke="#2B2B3A" stroke-width="2"/><rect x="439" y="184" width="122" height="4" fill="#3DFF8B"/><text x="449" y="206" class="mono" font-size="11" fill="#8D8DA3" text-anchor="start" textLength="13.2" lengthAdjust="spacing" xml:space="preserve">03</text><text x="500" y="226" class="mono" font-size="13" fill="#F4F4F6" text-anchor="middle" textLength="46.8" lengthAdjust="spacing" xml:space="preserve">ON THE</text><text x="500" y="244" class="mono" font-size="13" fill="#F4F4F6" text-anchor="middle" textLength="101.4" lengthAdjust="spacing" xml:space="preserve">TRUSTED LIST?</text><text x="509" y="160" class="mono" font-size="12" fill="#3DFF8B" text-anchor="start" textLength="21.6" lengthAdjust="spacing" xml:space="preserve">YES</text><polygon points="589,184 711,184 711,260 601,260 589,248" fill="#111118" stroke="#2B2B3A" stroke-width="2"/><rect x="589" y="184" width="122" height="4" fill="#FF2D95"/><text x="599" y="206" class="mono" font-size="11" fill="#8D8DA3" text-anchor="start" textLength="13.2" lengthAdjust="spacing" xml:space="preserve">04</text><text x="650" y="226" class="mono" font-size="13" fill="#F4F4F6" text-anchor="middle" textLength="93.6" lengthAdjust="spacing" xml:space="preserve">HAS STORAGE,</text><text x="650" y="244" class="mono" font-size="13" fill="#F4F4F6" text-anchor="middle" textLength="101.4" lengthAdjust="spacing" xml:space="preserve">SET TO BLOCK?</text><text x="659" y="294" class="mono" font-size="12" fill="#FF2D95" text-anchor="start" textLength="21.6" lengthAdjust="spacing" xml:space="preserve">YES</text><polygon points="739,184 861,184 861,260 751,260 739,248" fill="#111118" stroke="#2B2B3A" stroke-width="2"/><rect x="739" y="184" width="122" height="4" fill="#FF2D95"/><text x="749" y="206" class="mono" font-size="11" fill="#8D8DA3" text-anchor="start" textLength="13.2" lengthAdjust="spacing" xml:space="preserve">05</text><text x="800" y="226" class="mono" font-size="13" fill="#F4F4F6" text-anchor="middle" textLength="109.2" lengthAdjust="spacing" xml:space="preserve">ANYTHING ELSE,</text><text x="800" y="244" class="mono" font-size="13" fill="#F4F4F6" text-anchor="middle" textLength="101.4" lengthAdjust="spacing" xml:space="preserve">TRUSTED ONLY?</text><text x="809" y="294" class="mono" font-size="12" fill="#FF2D95" text-anchor="start" textLength="21.6" lengthAdjust="spacing" xml:space="preserve">YES</text><text x="275" y="214" class="mono" font-size="12" fill="#8D8DA3" text-anchor="middle" textLength="14.4" lengthAdjust="spacing" xml:space="preserve">NO</text><text x="425" y="214" class="mono" font-size="12" fill="#8D8DA3" text-anchor="middle" textLength="14.4" lengthAdjust="spacing" xml:space="preserve">NO</text><text x="575" y="214" class="mono" font-size="12" fill="#8D8DA3" text-anchor="middle" textLength="14.4" lengthAdjust="spacing" xml:space="preserve">NO</text><text x="725" y="214" class="mono" font-size="12" fill="#8D8DA3" text-anchor="middle" textLength="14.4" lengthAdjust="spacing" xml:space="preserve">NO</text><text x="895" y="214" class="mono" font-size="12" fill="#8D8DA3" text-anchor="middle" textLength="14.4" lengthAdjust="spacing" xml:space="preserve">NO</text><polygon points="870,52 985,52 985,104 882,104 870,92" fill="#3DFF8B"/><text x="927" y="79" class="cond" font-size="22" fill="#08080C" text-anchor="middle" textLength="76" lengthAdjust="spacingAndGlyphs">ALLOWED</text><text x="927" y="96" class="mono" font-size="11" fill="#08080C" text-anchor="middle" textLength="52.8" lengthAdjust="spacing" xml:space="preserve">IT WORKS</text><polygon points="870,330 985,330 985,382 882,382 870,370" fill="#FF2D95"/><text x="927" y="357" class="cond" font-size="22" fill="#08080C" text-anchor="middle" textLength="76" lengthAdjust="spacingAndGlyphs">BLOCKED</text><text x="927" y="374" class="mono" font-size="11" fill="#08080C" text-anchor="middle" textLength="79.2" lengthAdjust="spacing" xml:space="preserve">SWITCHED OFF</text><rect class="lamp" x="28" y="409" width="9" height="9" fill="#3DFF8B"/><text x="45" y="418" class="mono" font-size="13" fill="#8D8DA3" text-anchor="start" textLength="226.2" lengthAdjust="spacing" xml:space="preserve">a headset on the trusted list</text><rect class="lamp" x="305" y="409" width="9" height="9" fill="#FF2D95"/><text x="322.2" y="418" class="mono" font-size="13" fill="#8D8DA3" text-anchor="start" textLength="171.6" lengthAdjust="spacing" xml:space="preserve">an unknown flash drive</text><rect class="lamp" x="527" y="409" width="9" height="9" fill="#00F0FF"/><text x="544.8" y="418" class="mono" font-size="13" fill="#8D8DA3" text-anchor="start" textLength="179.4" lengthAdjust="spacing" xml:space="preserve">a device no check stops</text><rect width="1000" height="440" fill="url(#scan)"/><polygon points="0,0 974,0 1000,26 1000,440 26,440 0,414" fill="none" stroke="#2B2B3A" stroke-width="2"/></g></svg>
