<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 14" width="1200" height="14" role="img" aria-labelledby="t d"><title id="t">Divider</title><desc id="d">A strip of warning stripes.</desc><defs><pattern id="hz" width="32" height="32" patternUnits="userSpaceOnUse" patternTransform="skewX(-45)"><rect width="32" height="32" fill="#FCEE0A"/><rect width="16" height="32" fill="#08080C"/></pattern><clipPath id="bar"><polygon points="14,0 1200,0 1186,14 0,14"/></clipPath><linearGradient id="tail" x1="0" x2="1"><stop offset="0" stop-color="#00F0FF" stop-opacity="0"/><stop offset="1" stop-color="#00F0FF"/></linearGradient><linearGradient id="tailback" x1="1" x2="0"><stop offset="0" stop-color="#FF2D95" stop-opacity="0"/><stop offset="1" stop-color="#FF2D95"/></linearGradient></defs><style>.mono{font-family:Consolas,'Cascadia Mono','SF Mono',Menlo,'DejaVu Sans Mono','Liberation Mono',monospace}.cond{font-family:Bahnschrift,'DIN Alternate','DIN Condensed','Roboto Condensed','Arial Narrow','Helvetica Neue',Arial,sans-serif;font-weight:700;font-stretch:condensed}@keyframes slide{to{transform:translateX(32px)}}@keyframes slideback{to{transform:translateX(-32px)}}@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}@keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}.slide{animation:slide 1.4s linear infinite}.slideback{animation:slideback 1.4s linear infinite}.blink{animation:blink 1s steps(1) infinite}.pulse{animation:pulse 1.6s ease-in-out infinite}@keyframes run{from{transform:translateX(-140px)}to{transform:translateX(1260px)}}@keyframes runback{from{transform:translateX(1260px)}to{transform:translateX(-140px)}}.run{animation:run 5s linear infinite}.runback{animation:runback 7s linear infinite}@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style><g clip-path="url(#bar)"><rect width="1200" height="14" fill="#08080C"/><path d="M0 7H1200" stroke="#2B2B3A" stroke-width="2"/><rect class="run" x="0" y="5" width="140" height="2" fill="url(#tail)"/><rect class="runback" x="0" y="7" width="140" height="2" fill="url(#tailback)"/><clipPath id="dl"><rect x="0" y="0" width="210" height="14"/></clipPath><g clip-path="url(#dl)"><rect class="slide" x="-64" y="0" width="338" height="14" fill="url(#hz)"/></g><clipPath id="dr"><rect x="990" y="0" width="210" height="14"/></clipPath><g clip-path="url(#dr)"><rect class="slideback" x="926" y="0" width="338" height="14" fill="url(#hz)"/></g></g></svg>
